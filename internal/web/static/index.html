<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OSINT Web Viewer</title>
    <!-- Cytoscape JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.26.0/cytoscape.min.js"></script>
    <style>
        :root {
            --bg-color: #0d1117;
            --panel-bg: #161b22;
            --border-color: #30363d;
            --text-color: #c9d1d9;
            --accent-color: #58a6ff;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }
        #cy {
            flex-grow: 1;
            height: 100%;
        }
        #sidebar {
            width: 350px;
            background-color: var(--panel-bg);
            border-left: 1px solid var(--border-color);
            padding: 20px;
            box-sizing: border-box;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }
        h2 {
            margin-top: 0;
            color: var(--accent-color);
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        input[type="text"] {
            width: 100%;
            padding: 8px;
            background-color: #0d1117;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            background-color: var(--accent-color);
            color: #000;
            border: none;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
        }
        button:hover {
            opacity: 0.9;
        }
        .info-panel {
            margin-top: 20px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 10px;
            background-color: #0d1117;
            display: none;
        }
        .info-row {
            margin-bottom: 8px;
            word-break: break-all;
        }
        .info-label {
            font-weight: bold;
            color: #8b949e;
            font-size: 0.85em;
        }
        .badge {
            display: inline-block;
            padding: 2px 6px;
            border-radius: 10px;
            font-size: 0.8em;
            background-color: #21262d;
            border: 1px solid var(--border-color);
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(0,0,0,0.8);
            padding: 20px;
            border-radius: 8px;
            display: none;
        }
    </style>
</head>
<body>

    <div id="cy"></div>

    <div id="sidebar">
        <h2>OSINT Viewer</h2>
        
        <div class="form-group">
            <label class="info-label" for="invId">Araştırma ID</label>
            <input type="text" id="invId" placeholder="Örn: inv-12345">
        </div>
        <div class="form-group">
            <button id="loadBtn">Grafı Yükle</button>
        </div>

        <div id="infoPanel" class="info-panel">
            <h3 style="margin-top:0; border-bottom:1px solid #30363d; padding-bottom:5px;">Detaylar</h3>
            <div id="infoContent"></div>
        </div>
    </div>

    <div id="loading">Veriler Yükleniyor...</div>

    <script src="app.js"></script>
</body>
</html>
